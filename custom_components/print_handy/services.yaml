add_spool:
  name: Add spool
  description: Create a new spool on the shelf for one printer. Load it into a slot afterwards with Assign spool.
  fields:
    device_id:
      name: Printer device
      description: Pick the printer's device instead of typing its id. Several devices run the service on each.
      required: false
      selector:
        device:
          integration: print_handy
          multiple: true
    printer_id:
      name: Printer id
      description: The Print Handy printer id (for example flashforge-ad5x), exactly as Print Handy names it. Optional when you pick the printer's device as the target.
      required: false
      example: flashforge-ad5x
      selector:
        text:
    material:
      name: Material
      description: Filament material for the new spool (for example PLA).
      required: true
      example: PLA
      selector:
        text:
    color:
      name: Color
      description: Filament color name for the new spool (for example White).
      required: true
      example: White
      selector:
        text:
    grams:
      name: Grams
      description: Full starting weight of the new spool, in grams.
      required: true
      example: 1000
      selector:
        number:
          min: 1
          step: 1
          mode: box
    brand:
      name: Brand
      description: Optional filament brand or vendor for the new spool.
      required: false
      example: Sunlu
      selector:
        text:
    hex:
      name: Color code
      description: Optional hex color code for the new spool, without a leading hash (for example 0C6283).
      required: false
      example: 0C6283
      selector:
        text:
