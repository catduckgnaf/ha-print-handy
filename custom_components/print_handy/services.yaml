send_gcode:
  name: Send G-code
  description: Send a G-code script to one printer, through Print Handy's control API. The script is passed to the printer as given and can start a print or move the machine, so restrict who can call this service. Print Handy decides whether to honor it; a refusal fails the call with its reason.
  fields:
    device_id:
      name: Printer device
      description: Pick the printer's device instead of typing its id. Several devices run the service on each.
      required: false
      selector:
        device:
          integration: print_handy
          multiple: true
    printer_id:
      name: Printer id
      description: The Print Handy printer id (for example flashforge-ad5x), exactly as Print Handy names it. Optional when you pick the printer's device as the target.
      required: false
      example: flashforge-ad5x
      selector:
        text:
    script:
      name: Script
      description: The G-code script text to send to the printer (for example "M104 S200").
      required: true
      example: M104 S200
      selector:
        text:
exclude_object:
  name: Exclude object
  description: Exclude one object from the print running on one Moonraker printer, by the object name shown on the Current object sensor. Excluding the last remaining object is refused — Print Handy's reason says to cancel the print instead.
  fields:
    device_id:
      name: Printer device
      description: Pick the printer's device instead of typing its id. Several devices run the service on each.
      required: false
      selector:
        device:
          integration: print_handy
          multiple: true
    printer_id:
      name: Printer id
      description: The Print Handy printer id (for example flashforge-ad5x), exactly as Print Handy names it. Optional when you pick the printer's device as the target.
      required: false
      example: flashforge-ad5x
      selector:
        text:
    object:
      name: Object
      description: Name of the object to exclude, exactly as the Current object sensor lists it.
      required: true
      example: cube_1
      selector:
        text:
