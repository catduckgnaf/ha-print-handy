assign_spool:
  name: Assign spool
  description: Assign a spool to a slot on one printer. A spool already in the slot goes back on the shelf.
  fields:
    device_id:
      name: Printer device
      description: Pick the printer's device instead of typing its id. Several devices run the service on each.
      required: false
      selector:
        device:
          integration: print_handy
          multiple: true
    printer_id:
      name: Printer id
      description: The Print Handy printer id (for example flashforge-ad5x), exactly as Print Handy names it. Optional when you pick the printer's device as the target.
      required: false
      example: flashforge-ad5x
      selector:
        text:
    slot:
      name: Slot
      description: Slot number to assign the spool to.
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: box
    spool_id:
      name: Spool
      description: Spoolman spool id to assign, as shown on the shelf and slot spool sensors.
      required: true
      example: 7
      selector:
        number:
          min: 1
          step: 1
          mode: box
swap_spools:
